<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editor de Oficio - Estilo Word</title>
    <!-- Quill CSS (Estilo moderno tipo Word / Google Docs) -->
    <link href="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.snow.css" rel="stylesheet">
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f3f3f3; }
        #container { max-width: 850px; margin: auto; background: white; padding: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border-radius: 8px; display: flex; flex-direction: column; height: 85vh; }
        h2 { color: #2c3e50; margin-top: 0; font-size: 20px; border-bottom: 2px solid #0078d4; padding-bottom: 10px; }
        #editor-container { flex: 1; display: flex; flex-direction: column; margin-top: 10px; }
        .ql-toolbar { border: 1px solid #ccc !important; border-radius: 6px 6px 0 0; background: #fafafa; }
        .ql-container { border: 1px solid #ccc !important; border-top: none !important; border-radius: 0 0 6px 6px; font-size: 14px; flex: 1; }
        .btn-guardar { margin-top: 20px; background: #0078d4; color: white; border: none; padding: 12px 25px; font-size: 15px; border-radius: 6px; cursor: pointer; font-weight: bold; align-self: flex-end; transition: background 0.2s; }
        .btn-guardar:hover { background: #005a9e; }
    </style>
</head>
<body>
    <div id="container">
        <h2>Redactor de Oficios — Editor Web</h2>
        <div id="editor-container">
            <div id="editor"></div>
        </div>
        <button class="btn-guardar" onclick="guardarYcerrar()">💾 Guardar texto en la aplicación</button>
    </div>

    <!-- Quill JS -->
    <script src="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.min.js"></script>
    <script>
        var quill = new Quill('#editor', {
            theme: 'snow',
            placeholder: 'Escribe o pega el contenido de tu oficio aquí con formatos y estilos...',
            modules: {
                toolbar: [
                    [{ header: [1, 2, 3, false] }],
                    ['bold', 'italic', 'underline', 'strike'],
                    [{ color: [] }, { background: [] }],
                    [{ align: [] }],
                    [{ list: 'ordered' }, { list: 'bullet' }],
                    ['clean']
                ]
            }
        });

        // Función que recibe el texto actual desde Python al abrirse
        function setContent(htmlContent) {
            if (htmlContent) {
                quill.root.innerHTML = htmlContent;
            }
        }

        // Envía el contenido HTML de vuelta a Python al hacer clic en guardar
        function guardarYcerrar() {
            var contenidoHtml = quill.root.innerHTML;
            if (window.pywebview) {
                window.pywebview.api.guardar_desde_web(contenidoHtml);
            } else {
                alert("Contenido capturado exitosamente.");
            }
        }
    </script>
</body>
</html>
